<!-- Supabase Auth → Emails → Change email address. Subject: haci yeni e-posta adresini onayla -->
<div style="background:#141414;padding:32px 16px;font-family:Helvetica,Arial,sans-serif;color:#e8e6e3">
  <div style="max-width:480px;margin:0 auto;background:#1c1c1c;border:1px solid #2a2a2a;border-radius:4px;padding:32px">
    <p style="margin:0 0 4px;font-family:monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#c0392b">haci</p>
    <h1 style="margin:0 0 16px;font-size:20px;color:#e8e6e3">Yeni e-posta adresini onayla</h1>
    <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#b5b2ae">Hesabının e-posta adresini {{ .Email }} yerine {{ .NewEmail }} yapmak için aşağıdaki bağlantıya tıkla.</p>
    <a href="{{ .SiteURL }}/auth/callback?via=email&type=email_change&next=/account&token_hash={{ .TokenHash }}" style="display:inline-block;background:#c0392b;color:#ffffff;text-decoration:none;font-size:14px;padding:12px 20px;border-radius:4px">Yeni adresimi onayla</a>
    <p style="margin:24px 0 0;font-size:12px;line-height:1.6;color:#8a8783">Bu değişikliği sen istemediysen bu e-postayı yok say ve contact@hacininkokteylleri.tech adresine yaz.</p>
  </div>
</div>
